send_command:
  name: Send Command
  description: Send commands to Sony AVR processor
  target:
    entity:
      integration: sonyavr
      domain: media_player
  fields:
    Command:
      name: Command
      description: 'The Command to send to the AVR.'
      required: true
      selector:
        select:
          multiple: false
          options:
            - Mute
            - UnMute
            - Power On
            - Power Off
            - Volume Up
            - Volume Down
            - Source Up
            - Source Down
            - Set Volume
            - Set Sound Field
            - Set Source
            - Byte Array String
    Value:
      name: Command Value
      description: 'The value associated with the command. For Set Volume, the volume in the AVR''s own units: dB (e.g. -40.5) or steps (e.g. 30), depending on its Volume Display setting, not 0-1.'
      required: false
      selector:
        text:

update_state:
  name: Update Sony AVR
  description: Force an update of the Home Assistant states
  target:
    entity:
      integration: sonyavr
      domain: media_player
